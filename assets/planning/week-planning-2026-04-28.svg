<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700" role="img" aria-labelledby="title desc">
  <title id="title">Week Planning</title>
  <desc id="desc">Recovery week agenda: cleaning first, guests protected, then a gentle 3D printing restart.</desc>
  <defs>
    <style>
      .bg{fill:#fbfcff}.title{font:800 70px Arial,sans-serif;fill:#10213f}.subtitle{font:italic 28px Arial,sans-serif;fill:#50617e}.h{font:700 30px Arial,sans-serif;fill:#111827}.text{font:22px Arial,sans-serif;fill:#1f2937}.small{font:19px Arial,sans-serif;fill:#374151}.tiny{font:17px Arial,sans-serif;fill:#4b5563}.green{fill:#0f6b3d}.purple{fill:#4b2aa0}.blue{fill:#0b58b8}.card{fill:#fff;stroke:#d7dee9;stroke-width:2}.softgreen{fill:#f0fbf4;stroke:#b8ddc5}.softpurple{fill:#f6f1ff;stroke:#d7c8ff}.softblue{fill:#eff7ff;stroke:#bdd9ff}.softyellow{fill:#fff9eb;stroke:#f0c766}.pill{fill:#fff;stroke:#d7dee9;stroke-width:2}.muted{fill:#6b7280}.line{stroke:#d7dee9;stroke-width:2}.bulletgreen{fill:#2f8a4c}.bulletpurple{fill:#6844bf}.bulletblue{fill:#1d6fd1}
    </style>
  </defs>
  <rect class="bg" width="1200" height="1700" rx="28"/>
  <rect x="14" y="14" width="1172" height="1672" rx="28" fill="none" stroke="#c8d3ea" stroke-width="3"/>

  <text x="600" y="95" text-anchor="middle" class="title">Week Planning</text>
  <text x="600" y="140" text-anchor="middle" class="subtitle">Recovery week, cleaning first, then guests, then a gentle restart</text>

  <rect x="50" y="175" width="1100" height="88" rx="18" class="pill"/>
  <text x="110" y="230" font-size="36">♡</text><text x="160" y="226" class="h">Recovery mode</text>
  <line x1="335" y1="190" x2="335" y2="248" class="line"/>
  <text x="375" y="228" font-size="34">🧹</text><text x="425" y="226" class="h">Cleaning priority</text>
  <line x1="625" y1="190" x2="625" y2="248" class="line"/>
  <text x="665" y="228" font-size="34">👥</text><text x="715" y="214" class="h">Guest block</text><text x="715" y="244" class="h">protected</text>
  <line x1="895" y1="190" x2="895" y2="248" class="line"/>
  <text x="930" y="228" font-size="34">🌱</text><text x="980" y="214" class="h">Gentle restart</text><text x="980" y="244" class="h">after guests</text>

  <!-- Day cards -->
  <g transform="translate(50,300)">
    <rect width="1100" height="135" rx="16" class="card softgreen"/>
    <text x="35" y="56" font-size="34">📅</text><text x="92" y="55" class="h green">TUESDAY</text><text x="92" y="90" class="text green">2026-04-28</text>
    <line x1="245" y1="18" x2="245" y2="117" class="line"/>
    <text x="280" y="45" class="h">Apartment reset, part 1</text>
    <circle cx="288" cy="76" r="5" class="bulletgreen"/><text x="305" y="83" class="small">Pick up clutter in main areas</text>
    <circle cx="288" cy="104" r="5" class="bulletgreen"/><text x="305" y="111" class="small">Clear dishes, kitchen surfaces, trash, recycling, laundry</text>
    <rect x="735" y="32" width="230" height="72" rx="14" fill="#f8fff9" stroke="#83bd91" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="760" y="65" class="small">✓ Optional:</text><text x="790" y="92" class="small">5-minute 3D check</text><text x="1018" y="88" font-size="48">🧴</text>
  </g>

  <g transform="translate(50,455)">
    <rect width="1100" height="135" rx="16" class="card softgreen"/>
    <text x="35" y="56" font-size="34">📅</text><text x="92" y="55" class="h green">WEDNESDAY</text><text x="92" y="90" class="text green">2026-04-29</text>
    <line x1="245" y1="18" x2="245" y2="117" class="line"/>
    <text x="280" y="45" class="h">Apartment reset, part 2</text>
    <circle cx="288" cy="76" r="5" class="bulletgreen"/><text x="305" y="83" class="small">Clean bathroom, vacuum or sweep main areas</text>
    <circle cx="288" cy="104" r="5" class="bulletgreen"/><text x="305" y="111" class="small">Finish laundry or bedding, clear guest-facing surfaces</text>
    <rect x="735" y="32" width="240" height="72" rx="14" fill="#f8fff9" stroke="#83bd91" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="760" y="65" class="small">✓ Optional:</text><text x="790" y="92" class="small">one organizer V1 sentence</text><text x="1025" y="88" font-size="48">🧹</text>
  </g>

  <g transform="translate(50,610)">
    <rect width="1100" height="135" rx="16" class="card softgreen"/>
    <text x="35" y="56" font-size="34">📅</text><text x="92" y="55" class="h green">THURSDAY</text><text x="92" y="90" class="text green">2026-04-30</text>
    <line x1="245" y1="18" x2="245" y2="117" class="line"/>
    <text x="280" y="45" class="h">Buffer + guest prep</text>
    <circle cx="288" cy="76" r="5" class="bulletgreen"/><text x="305" y="83" class="small">Finish leftover cleaning and prepare for guests</text>
    <circle cx="288" cy="104" r="5" class="bulletgreen"/><text x="305" y="111" class="small">Do a quick 10-minute reset</text>
    <rect x="685" y="32" width="315" height="72" rx="14" fill="#eefbf1" stroke="#5ca86d" stroke-width="2"/>
    <text x="712" y="65" class="small">💡 Optional 3D task:</text><text x="742" y="92" class="small">Decide tray vs compact case</text><text x="1040" y="88" font-size="46">☑</text>
  </g>

  <g transform="translate(50,765)">
    <rect width="1100" height="120" rx="16" class="card softpurple"/>
    <text x="35" y="52" font-size="34">📅</text><text x="92" y="52" class="h purple">FRIDAY</text><text x="92" y="86" class="text purple">2026-05-01</text>
    <line x1="245" y1="18" x2="245" y2="102" class="line"/>
    <text x="280" y="44" class="h purple">Guests / no work block</text>
    <circle cx="288" cy="75" r="5" class="bulletpurple"/><text x="305" y="82" class="small">No 3D printing business work, no GitHub planning work</text>
    <text x="1018" y="78" font-size="52">🏖️</text>
  </g>

  <g transform="translate(50,900)">
    <rect width="1100" height="120" rx="16" class="card softpurple"/>
    <text x="35" y="52" font-size="34">📅</text><text x="92" y="52" class="h purple">SATURDAY</text><text x="92" y="86" class="text purple">2026-05-02</text>
    <line x1="245" y1="18" x2="245" y2="102" class="line"/>
    <text x="280" y="44" class="h purple">Guests / no work block</text>
    <circle cx="288" cy="75" r="5" class="bulletpurple"/><text x="305" y="82" class="small">Keep the day free, rest without guilt, no required planning</text>
    <text x="1018" y="78" font-size="52">☕</text>
  </g>

  <g transform="translate(50,1035)">
    <rect width="1100" height="120" rx="16" class="card softpurple"/>
    <text x="35" y="52" font-size="34">📅</text><text x="92" y="52" class="h purple">SUNDAY</text><text x="92" y="86" class="text purple">2026-05-03</text>
    <line x1="245" y1="18" x2="245" y2="102" class="line"/>
    <text x="280" y="44" class="h purple">Guests / no work block</text>
    <circle cx="288" cy="75" r="5" class="bulletpurple"/><text x="305" y="82" class="small">Keep the day free, capture ideas only if needed</text>
    <text x="1018" y="78" font-size="52">💡</text>
  </g>

  <g transform="translate(50,1170)">
    <rect width="1100" height="120" rx="16" class="card softblue"/>
    <text x="35" y="52" font-size="34">📅</text><text x="92" y="52" class="h blue">MONDAY</text><text x="92" y="86" class="text blue">2026-05-04</text>
    <line x1="245" y1="18" x2="245" y2="102" class="line"/>
    <text x="280" y="44" class="h blue">Guest buffer / recovery</text>
    <circle cx="288" cy="75" r="5" class="bulletblue"/><text x="305" y="82" class="small">Light reset only if needed, no required 3D work</text>
    <text x="1018" y="78" font-size="52">🫖</text>
  </g>

  <g transform="translate(50,1325)">
    <rect width="690" height="260" rx="18" fill="#f0f7ff" stroke="#4e9dff" stroke-width="3"/>
    <text x="40" y="58" font-size="46">🌅</text><text x="115" y="58" class="h blue" font-size="34">Gentle restart</text>
    <text x="45" y="112" class="h blue">TUESDAY</text><text x="45" y="145" class="text blue">2026-05-05</text>
    <circle cx="270" cy="96" r="5" class="bulletblue"/><text x="287" y="103" class="small">Reopen the visual agenda</text>
    <circle cx="270" cy="126" r="5" class="bulletblue"/><text x="287" y="133" class="small">Choose organizer format: tray or compact case</text>
    <circle cx="270" cy="156" r="5" class="bulletblue"/><text x="287" y="163" class="small">Pick the first base size target</text>
    <line x1="270" y1="185" x2="610" y2="185" stroke="#80aee6" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="270" y="215" class="small" fill="#0b58b8">Optional: sketch 2 layouts, define a tiny tolerance test</text>
    <text x="585" y="145" font-size="70">📋</text>
  </g>

  <g transform="translate(770,1325)">
    <rect width="380" height="260" rx="18" class="softyellow"/>
    <text x="35" y="62" font-size="48">🛡️</text><text x="105" y="60" class="h">This week’s rule</text>
    <text x="45" y="112" class="small">Do not force a big 3D project</text>
    <text x="45" y="142" class="small">while cleaning and hosting guests.</text>
    <text x="45" y="182" class="small">Success = apartment cleaned enough,</text>
    <text x="45" y="212" class="small">guest block protected, then one</text>
    <text x="45" y="242" class="small">tiny 3D decision later.</text>
  </g>

  <text x="600" y="1645" text-anchor="middle" class="small" fill="#52627d">Be kind to yourself. Small steps, protected time, meaningful progress. ♥</text>
</svg>
